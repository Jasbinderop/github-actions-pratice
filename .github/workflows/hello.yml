---
name: Hello World workflow
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'feature-**'
jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: JOB 1
        run: |
          echo "job one is starts"
          exit 1
  job-2:
    needs: job-1
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: JOB 2
        run: echo "job two runs after job 1"



